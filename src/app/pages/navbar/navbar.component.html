<div class="nav-shell">
    <div class="nav-progress" [style.width.%]="progress" aria-hidden="true"></div>

    <nav class="nav container" aria-label="Primary">
        <a class="brand" href="#Home" (click)="goHome($event)">
            <span class="brand-mark" aria-hidden="true">
                <span>B</span>
            </span>
            <span class="brand-text">Balaji<span class="brand-dot">.</span></span>
        </a>

        <div class="nav-links" role="list">
            @for (nav of navLink; track nav) {
                <button
                    type="button"
                    class="nav-link"
                    role="listitem"
                    [class.active]="activeSection === nav"
                    (click)="navLinkClicked(nav)"
                    [attr.aria-current]="activeSection === nav ? 'page' : null">
                    {{ nav }}
                </button>
            }
        </div>

        <div class="nav-actions">
            <button
                type="button"
                class="icon-btn"
                (click)="themeService.toggle()"
                [attr.aria-label]="themeService.isDark() ? 'Switch to light theme' : 'Switch to dark theme'"
                title="Toggle theme">
                @if (themeService.isDark()) {
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <circle cx="12" cy="12" r="4"></circle>
                        <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path>
                    </svg>
                } @else {
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                    </svg>
                }
            </button>

            <a class="btn btn--ghost btn--sm nav-admin" routerLink="/admin/login">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <rect x="3" y="11" width="18" height="11" rx="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
                Admin
            </a>

            <button
                type="button"
                class="icon-btn burger"
                [class.open]="menuOpen"
                (click)="toggleMenu()"
                [attr.aria-expanded]="menuOpen"
                aria-controls="mobile-menu"
                aria-label="Toggle navigation menu">
                <span></span>
                <span></span>
            </button>
        </div>
    </nav>

    @if (menuOpen) {
        <div class="nav-drawer" id="mobile-menu">
            <div class="nav-drawer-inner container">
                @for (nav of navLink; track nav; let i = $index) {
                    <button
                        type="button"
                        class="drawer-link"
                        [class.active]="activeSection === nav"
                        (click)="navLinkClicked(nav)"
                        [style.--i]="i">
                        <span class="drawer-index">0{{ i + 1 }}</span>
                        {{ nav }}
                    </button>
                }
                <a class="drawer-link drawer-admin" routerLink="/admin/login" (click)="closeMenu()">
                    <span class="drawer-index">05</span>
                    Admin
                </a>

                <div class="drawer-footer">
                    <span>Balaji Seenivasan</span>
                    <span class="drawer-footer-dot"></span>
                    <span>Full Stack Developer</span>
                </div>
            </div>
        </div>
    }
</div>
